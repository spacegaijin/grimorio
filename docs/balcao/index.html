<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a09">
<title>Balcão — Grimório</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{--bg:#0c0a09;--bg2:#17120f;--card:#1f1915;--borda:#3a2e26;--txt:#f1e6d6;--txt2:#a89a88;--ac:#ff8a2a;--ac2:#ffc247;--ok:#4cd17a;--azul:#1e5bd8;--verm:#d62828}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--borda);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;flex:1;font-family:Georgia,serif;letter-spacing:3px;text-transform:uppercase}
.jogo-sel{display:flex;border:1px solid var(--borda);border-radius:20px;overflow:hidden}
.jogo-sel button{background:var(--card);border:0;color:var(--txt2);padding:6px 12px;font-size:13px}
.jogo-sel button.on{background:var(--ac);color:#000;font-weight:600}
main{max-width:720px;margin:0 auto;padding:12px 12px 40px}

/* câmera */
.cam{position:relative;background:#000;border-radius:14px;overflow:hidden;height:62vh;min-height:360px;border:1px solid var(--borda)}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .mira{position:absolute;left:4%;right:4%;top:6%;height:40%;transition:all .2s;border:2px solid var(--ac2);border-radius:8px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);pointer-events:none}
.cam .mira::after{content:"encaixe a parte de cima da carta (o nome) aqui";position:absolute;left:0;right:0;top:-24px;text-align:center;color:var(--ac2);font-size:12px;letter-spacing:1px;text-shadow:0 0 6px #000}
.cam.pequena .mira{left:8%;right:8%;top:22%;height:14%}
.cam.inteira .mira{left:50%;right:auto;top:7%;height:85%;aspect-ratio:63/88;transform:translateX(-50%);border-radius:12px}
.cam.inteira .mira::after{content:"encaixe a CARTA INTEIRA na moldura"}
.cam .mira .z{display:none;position:absolute;border:1.5px dashed rgba(255,255,255,.85);border-radius:4px}
.cam.inteira .mira .z{display:block}
.cam .mira .z-nome{left:4%;right:4%;top:3%;height:9%}
.cam .mira .z-set{left:3%;width:62%;bottom:1.5%;height:7%}
.edicoes{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;margin:-6px 0 10px;-webkit-overflow-scrolling:touch}
.edicoes button{flex:none;width:92px;background:var(--card);border:1px solid var(--borda);border-radius:8px;padding:4px;color:var(--txt);font-size:10px;line-height:1.2;text-align:center}
.edicoes button img{width:100%;border-radius:4px;display:block;margin-bottom:3px;background:#000;aspect-ratio:63/88;object-fit:cover}
.edicoes button.on{border-color:var(--ac2);background:#2a2012}
.edicoes .tit{flex:none;align-self:center;color:var(--txt2);font-size:12px;writing-mode:vertical-rl;transform:rotate(180deg)}
.cam .lido{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:13px;color:#fff;min-height:34px}
.cam .lido b{color:var(--ac2)}
.cam .semcam{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--txt2)}
.ctrl{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.ctrl button{background:var(--card);border:1px solid var(--borda);color:var(--txt);border-radius:20px;padding:8px 14px}
.ctrl button.pri{background:var(--ac);border-color:var(--ac);color:#000;font-weight:600}
.ctrl label{background:var(--card);border:1px solid var(--borda);color:var(--txt);border-radius:20px;padding:8px 14px;cursor:pointer}
.ctrl label input{display:none}
input.nome{width:100%;background:var(--card);border:1px solid var(--borda);color:var(--txt);border-radius:20px;padding:10px 14px;font-size:16px;margin-bottom:8px}
.status{color:var(--txt2);font-size:13px;min-height:18px;margin-bottom:8px}
.sugestoes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.sugestoes button{background:var(--card);border:1px solid var(--borda);color:var(--txt);border-radius:16px;padding:7px 12px;font-size:14px}
.sugestoes button.hit{border-color:var(--ac2);background:#2a2012}

/* item */
.item{background:var(--card);border:1px solid var(--ac);border-radius:14px;padding:12px;margin-bottom:14px;display:flex;gap:12px;align-items:flex-start}
.item img{width:96px;border-radius:6px;background:#000}
.item .campos{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.item .campos b{font-size:16px}
.item .campos .ed{color:var(--txt2);font-size:12px}
.item a.liga{display:block;background:var(--azul);color:#fff;text-decoration:none;border-radius:8px;padding:10px 12px;font-weight:600;text-align:center}
.item a.liga.pk{background:var(--verm)}
.item .preco{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .preco input{width:110px;background:var(--bg);border:1px solid var(--borda);color:var(--txt);border-radius:8px;padding:9px 10px;font-size:17px}
.item .preco input.qtd{width:58px}
.item .colar{background:transparent;border:1px solid var(--borda);color:var(--txt);border-radius:8px;padding:9px 10px}
.item .add{background:var(--ok);color:#000;font-weight:700;border:0;border-radius:8px;padding:10px 14px}
.item .canc{background:transparent;border:1px solid var(--borda);color:var(--txt2);border-radius:8px;padding:10px 12px}

/* carrinho */
.carrinho{background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:12px}
.carrinho h3{margin:0 0 8px;font-size:13px;color:var(--txt2);text-transform:uppercase;letter-spacing:1px}
.carrinho .it{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--borda);font-size:14px}
.carrinho .it:last-child{border-bottom:0}
.carrinho .it .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.carrinho .it .vl{color:var(--ac2);font-weight:600}
.carrinho .it .rm{background:transparent;border:0;color:var(--txt2);font-size:18px;padding:0 6px}
.carrinho .tot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:18px}
.carrinho .tot b{color:var(--ac2);font-size:24px}
.carrinho .acoes{display:flex;gap:8px;margin-top:10px}
.carrinho .acoes{flex-wrap:wrap}
.carrinho .acoes button{background:transparent;border:1px solid var(--borda);color:var(--txt);border-radius:8px;padding:8px 12px}
.carrinho .acoes button.zap{background:#25d366;border-color:#25d366;color:#000;font-weight:700}
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
.sheet[hidden]{display:none}
.sheet-cab{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg2);border-bottom:1px solid var(--borda)}
.sheet-cab b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-cab a{color:var(--ac2);text-decoration:none;font-size:14px}
.sheet-cab button{background:transparent;border:1px solid var(--borda);color:var(--txt);border-radius:8px;padding:6px 10px}
.sheet iframe{flex:1;border:0;background:#fff}
.sheet-aviso{padding:6px 12px;font-size:12px;color:var(--txt2);background:var(--bg2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:.95}
</style>
</head>
<body>
<header>
  <h1>Balcão</h1>
  <div class="jogo-sel" id="jogoSel"><button data-j="Magic" class="on">Magic</button><button data-j="Pokémon">Pokémon</button></div>
</header>
<main>
  <div class="cam" id="cam">
    <video id="video" playsinline muted autoplay></video>
    <div class="mira"><div class="z z-nome"></div><div class="z z-set"></div></div>
    <div class="lido" id="lido">Ligando a câmera…</div>
  </div>
  <div class="ctrl">
    <button class="pri" id="btLer">Ler agora</button>
    <button id="btAuto">Auto: ligado</button>
    <button id="btTrocar">Trocar câmera</button>
    <button id="btModo">Modo: nome</button>
    <button id="btCaixa">Caixa: grande</button>
    <label>📷 Foto<input type="file" id="foto" accept="image/*" capture="environment"></label>
  </div>
  <input class="nome" id="nome" placeholder="ou digite o nome da carta">
  <div class="status" id="status"></div>
  <div class="sugestoes" id="sugestoes"></div>
  <div id="item"></div>
  <div class="edicoes" id="edicoes"></div>
  <div class="carrinho">
    <h3>Levando</h3>
    <div id="itens"><div class="status">Nada ainda.</div></div>
    <div class="tot"><span>Total</span><b id="total">R$ 0,00</b></div>
    <div class="acoes"><button id="whats" class="zap">Enviar no WhatsApp</button><button id="copiar">Copiar lista</button><button id="limpar">Limpar</button></div>
  </div>
</main>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-cab"><b id="sheetTit">Liga</b><a id="sheetFora" href="#" target="_blank" rel="noopener">Abrir fora ↗</a><button id="sheetFechar">Fechar ✕</button></div>
  <iframe id="sheetFrame" src="about:blank" referrerpolicy="no-referrer"></iframe>
  <div class="sheet-aviso">Se a Liga não aparecer aqui dentro (ela pode bloquear), use "Abrir fora".</div>
</div>

<script>
/* ===== estado ===== */
var jogo = 'Magic';
var carrinho = [];
var itemAtual = null;
var auto = true;
var lendo = false;
var ultimoTexto = '';
var worker = null;
var stream = null;
var usarFrontal = false;
var buscaTimer = null;
var ultimaBusca = '';

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function dinheiro(v){ return 'R$ ' + v.toFixed(2).replace('.', ','); }
function lerPreco(s){ s = String(s || '').replace(/[^0-9,\.]/g, ''); if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.'); var v = parseFloat(s); return isNaN(v) ? 0 : v; }
function status(t){ $('status').textContent = t || ''; }
function toast(t){ var e = $('toast'); e.textContent = t; e.classList.add('on'); setTimeout(function(){ e.classList.remove('on'); }, 1800); }
function ligaUrl(nome){
  return jogo === 'Magic'
    ? 'https://www.ligamagic.com.br/?view=cards/card&card=' + encodeURIComponent(nome)
    : 'https://www.ligapokemon.com.br/?view=cards/card&card=' + encodeURIComponent(nome);
}
try { var salvo = JSON.parse(localStorage.getItem('balcao-carrinho') || '[]'); if (Array.isArray(salvo)) carrinho = salvo; } catch (e) {}

/* ===== câmbio do dia (AwesomeAPI, aberta) ===== */
var cambio = {USD: 0, EUR: 0};
function carregarCambio(){
  fetch('https://economia.awesomeapi.com.br/last/USD-BRL,EUR-BRL').then(function(r){ return r.json(); }).then(function(j){
    if (j.USDBRL) cambio.USD = parseFloat(j.USDBRL.bid) || 0;
    if (j.EURBRL) cambio.EUR = parseFloat(j.EURBRL.bid) || 0;
  }).catch(function(){});
}
carregarCambio();
function emReais(valor, moeda){
  var tx = cambio[moeda] || 0;
  return (valor > 0 && tx > 0) ? valor * tx : 0;
}

/* ===== câmera ===== */
function ligarCamera(){
  if (stream) { stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { semCamera('Este navegador não libera a câmera. Use o botão 📷 Foto.'); return; }
  navigator.mediaDevices.getUserMedia({video: {facingMode: usarFrontal ? 'user' : {ideal: 'environment'}, width: {ideal: 1280}, height: {ideal: 960}}, audio: false})
    .then(function(s){ stream = s; $('video').srcObject = s; $('lido').textContent = 'Mire o nome da carta no retângulo.'; if (auto) loopAuto(); })
    .catch(function(e){ semCamera('Câmera bloqueada (' + e.name + '). Permita a câmera no navegador ou use 📷 Foto.'); });
}
function semCamera(msg){
  var c = $('cam'); if (!c.querySelector('.semcam')) { var d = document.createElement('div'); d.className = 'semcam'; d.textContent = msg; c.appendChild(d); }
  $('lido').textContent = '';
}

/* ===== OCR ===== */
function getWorker(){
  if (worker) return Promise.resolve(worker);
  if (typeof Tesseract === 'undefined') return Promise.reject(new Error('leitor não carregou'));
  status('Carregando leitor de texto (só na primeira vez)…');
  return Tesseract.createWorker('eng').then(function(w){
    worker = w;
    return w.setParameters({tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz'-,. ", tessedit_pageseg_mode: '6'}).then(function(){ status(''); return w; });
  });
}
var modo = 'nome';
function recorteMira(){ return recorteDe($('cam').querySelector('.mira'), 900); }
function recorteDe(el, alvoW){
  var v = $('video');
  if (!v.videoWidth) return null;
  /* recorta exatamente a área do elemento (object-fit:cover) */
  var box = $('cam').getBoundingClientRect(), mb = el.getBoundingClientRect();
  var escala = Math.max(box.width / v.videoWidth, box.height / v.videoHeight);
  var vw = v.videoWidth * escala, vh = v.videoHeight * escala;
  var offx = (vw - box.width) / 2, offy = (vh - box.height) / 2;
  var sx = (mb.left - box.left + offx) / escala, sy = (mb.top - box.top + offy) / escala;
  var sw = mb.width / escala, sh = mb.height / escala;
  var cv = document.createElement('canvas');
  var f = alvoW / sw;
  cv.width = alvoW; cv.height = Math.round(sh * f);
  var ctx = cv.getContext('2d');
  ctx.drawImage(v, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
  preparar(ctx, cv.width, cv.height);
  return cv;
}
function preparar(ctx, w, h){
  var d = ctx.getImageData(0, 0, w, h), p = d.data;
  for (var i = 0; i < p.length; i += 4) {
    var g = 0.3 * p[i] + 0.59 * p[i + 1] + 0.11 * p[i + 2];
    g = (g - 128) * 1.5 + 128; g = g < 0 ? 0 : g > 255 ? 255 : g;
    p[i] = p[i + 1] = p[i + 2] = g;
  }
  ctx.putImageData(d, 0, 0);
}
function limparTexto(t){
  t = String(t || '').replace(/\n/g, ' ').replace(/[^A-Za-zÀ-ÿ' \-,]/g, ' ').replace(/\s+/g, ' ').trim();
  var ruido = /^(basic|stage|evolves|from|hp|creature|instant|sorcery|enchantment|artifact|land|legendary|planeswalker|pokemon|ex|gx|the)$/i;
  return t.split(' ').filter(function(w){ return w.length > 1 && !ruido.test(w); }).join(' ').trim();
}
var workerSet = null;
function getWorkerSet(){
  if (workerSet) return Promise.resolve(workerSet);
  if (typeof Tesseract === 'undefined') return Promise.reject(new Error('leitor não carregou'));
  return Tesseract.createWorker('eng').then(function(w){
    workerSet = w;
    return w.setParameters({tessedit_char_whitelist: '0123456789/ABCDEFGHIJKLMNOPQRSTUVWXYZ ', tessedit_pageseg_mode: '6'}).then(function(){ return w; });
  });
}
/* rodapé: Magic "0238 M HOB PT" / "238/300 R DOM EN" ; Pokémon "025/165" */
function interpretarRodape(t){
  t = String(t || '').toUpperCase().replace(/\s+/g, ' ').trim();
  var out = {};
  var mp = t.match(/(\d{1,3})\s*\/\s*(\d{1,3})/);
  if (mp) { out.num = mp[1]; out.total = mp[2]; }
  var mn = t.match(/(?:^|\s)0*(\d{1,4})(?:\s*\/\s*0*\d{1,4})?(?=\s|$)/);
  if (mn && !out.num) out.num = mn[1];
  var toks = t.split(' ').filter(function(x){ return /^[A-Z0-9]{3}$/.test(x) && !/^\d+$/.test(x) && !/^(THE|AND|ART|ILL|TM|INC|LLC)$/.test(x); });
  if (toks.length) out.set = toks[toks.length - 1].toLowerCase();
  return out;
}
var ultimoRodape = '';
var pausaAte = 0, ignorarNome = '', ignorarAte = 0;
function lerQuadro(){
  if (lendo || itemAtual || Date.now() < pausaAte) return Promise.resolve();
  var cv = modo === 'inteira' ? recorteDe($('cam').querySelector('.z-nome'), 900) : recorteMira();
  if (!cv) return Promise.resolve();
  lendo = true;
  var rodape = modo === 'inteira' ? recorteDe($('cam').querySelector('.z-set'), 700) : null;
  var pRod = rodape ? getWorkerSet().then(function(w){ return w.recognize(rodape); }).then(function(r){ return interpretarRodape(r.data.text); }).catch(function(){ return {}; }) : Promise.resolve({});
  return getWorker().then(function(w){ return w.recognize(cv); }).then(function(r){
    return pRod.then(function(rod){ rodapeAtual = rod; return r; });
  }).then(function(r){
    var linhas = (r.data.lines || []).map(function(l){ return {t: limparTexto(l.text), c: l.confidence || 0}; })
      .filter(function(l){ return l.t.length >= 3 && l.c >= 35; })
      .sort(function(a, b){ return b.c - a.c; }).slice(0, 3);
    if (!linhas.length) { $('lido').textContent = 'Mire o nome da carta no retângulo…'; return; }
    var rodTxt = (rodapeAtual.set || rodapeAtual.num) ? ' · rodapé: ' + (rodapeAtual.set ? rodapeAtual.set.toUpperCase() + ' ' : '') + (rodapeAtual.num || '') + (rodapeAtual.total ? '/' + rodapeAtual.total : '') : '';
    $('lido').innerHTML = 'Li: <b>' + esc(linhas[0].t) + '</b> (' + Math.round(linhas[0].c) + '%)' + esc(rodTxt);
    return validarLinhas(linhas.map(function(l){ return l.t; }));
  }).catch(function(e){ status('Erro no leitor: ' + (e && e.message ? e.message : e)); }).then(function(){ lendo = false; });
}
function loopAuto(){
  if (!auto || !stream) return;
  lerQuadro().then(function(){ setTimeout(loopAuto, 500); });
}
/* só troca as sugestões quando alguma linha lida bate com nome de carta de verdade */
var cacheNomes = {};
var ultimoHit = '';
var rodapeAtual = {};
function validarLinhas(linhas){
  var i = 0;
  return new Promise(function(res){
    (function prox(){
      if (i >= linhas.length) { res(false); return; }
      var l = linhas[i++];
      var p = cacheNomes[l] ? Promise.resolve(cacheNomes[l]) : consultarNomes(l).then(function(n){ cacheNomes[l] = n; return n; });
      p.then(function(nomes){
        if (nomes.length && nomes[0] === ignorarNome && Date.now() < ignorarAte) { res(true); return; }
        if (nomes.length) {
          if (nomes[0] !== ultimoHit) {
            ultimoHit = nomes[0]; $('nome').value = l; desenharSugestoes(nomes, l, true);
            if (similaridade(l, nomes[0]) < 0.85) status('Leitura imperfeita ("' + l + '") — a sugestão mais parecida vem primeiro.');
            else status('');
            if (modo === 'inteira') tentarEdicaoExata(nomes[0], rodapeAtual);
          }
          res(true);
        } else prox();
      });
    })();
  });
}

/* foto enviada (fallback) */
function lerFoto(file){
  if (!file) return;
  var img = new Image();
  img.onload = function(){
    var W = Math.min(1600, img.naturalWidth), f = W / img.naturalWidth;
    var cv = document.createElement('canvas'); cv.width = W; cv.height = Math.round(img.naturalHeight * f);
    var ctx = cv.getContext('2d'); ctx.drawImage(img, 0, 0, cv.width, cv.height); preparar(ctx, cv.width, cv.height);
    status('Lendo a foto…');
    getWorker().then(function(w){ return w.setParameters({tessedit_pageseg_mode: '3'}).then(function(){ return w.recognize(cv); }); }).then(function(r){
      worker.setParameters({tessedit_pageseg_mode: '6'});
      var linhas = (r.data.text || '').split('\n').map(limparTexto).filter(function(l){ return l.length >= 3; });
      if (!linhas.length) { status('Não achei texto legível na foto.'); return; }
      status('Testando ' + linhas.length + ' linhas da foto…');
      testarLinhas(linhas.slice(0, 8));
    }).catch(function(e){ status('Erro: ' + e.message); });
  };
  img.src = URL.createObjectURL(file);
}
function testarLinhas(linhas){
  var i = 0;
  (function prox(){
    if (i >= linhas.length) { status('Nenhuma linha bateu com nome de carta. Digite o nome.'); return; }
    var l = linhas[i++];
    consultarNomes(l).then(function(nomes){
      if (nomes.length) { $('nome').value = l; desenharSugestoes(nomes, l, true); status('Achei pela linha "' + l + '".'); }
      else prox();
    });
  })();
}

/* ===== busca de nomes ===== */
/* ---- busca tolerante a erro de leitura ---- */
function similaridade(a, b){
  a = a.toLowerCase(); b = b.toLowerCase();
  if (a === b) return 1;
  var m = a.length, n = b.length; if (!m || !n) return 0;
  var prev = [], cur = [], i, j;
  for (j = 0; j <= n; j++) prev[j] = j;
  for (i = 1; i <= m; i++) { cur[0] = i; for (j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur.slice(); }
  return 1 - prev[n] / Math.max(m, n);

function buscaCrua(q){

/* catálogo completo de nomes, baixado uma vez e guardado no celular, para busca aproximada local */
var catalogo = {Magic: null, 'Pokémon': null}, carregandoCat = {};
function normalizar(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim(); }
function getCatalogo(){
  var j = jogo;
  if (catalogo[j]) return Promise.resolve(catalogo[j]);
  try { var s = localStorage.getItem('balcao-cat-' + j); if (s) { catalogo[j] = JSON.parse(s); return Promise.resolve(catalogo[j]); } } catch (e) {}
  if (carregandoCat[j]) return carregandoCat[j];
  status('Baixando lista de nomes (' + j + ') pela primeira vez…');
  var url = j === 'Magic' ? 'https://api.scryfall.com/catalog/card-names' : 'https://api.tcgdex.net/v2/en/cards';
  carregandoCat[j] = fetch(url).then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
    var nomes = [];
    if (j === 'Magic') nomes = (d && d.data) ? d.data : [];
    else { var v = {}; (Array.isArray(d) ? d : []).forEach(function(c){ if (c.name && !v[c.name]) { v[c.name] = 1; nomes.push(c.name); } }); }
    catalogo[j] = nomes.map(function(n){ return [n, normalizar(n)]; });
    try { localStorage.setItem('balcao-cat-' + j, JSON.stringify(catalogo[j])); } catch (e) {}
    status(''); return catalogo[j];
  }).catch(function(){ status(''); return []; });
  return carregandoCat[j];
}
function fuzzyLocal(q){
  var nq = normalizar(q); if (nq.length < 3) return Promise.resolve([]);
  return getCatalogo().then(function(cat){
    var palavras = nq.split(' ').filter(function(w){ return w.length >= 3; });
    var out = [];
    for (var i = 0; i < cat.length; i++) {
      var n = cat[i][1];
      /* corte rápido: tamanho parecido ou alguma palavra em comum */
      if (Math.abs(n.length - nq.length) > 8 && !palavras.some(function(w){ return n.indexOf(w) >= 0; })) continue;
      var s = similaridade(nq, n);
      if (s < 0.55) {
        /* leitura parcial: compara com o começo do nome do mesmo tamanho */
        var s2 = similaridade(nq, n.slice(0, nq.length));
        if (s2 > s) s = s2 * 0.95;
      }
      if (s >= 0.55) out.push([s, cat[i][0]]);
    }
    out.sort(function(a, b){ return b[0] - a[0]; });
    return out.slice(0, 10).map(function(x){ return x[1]; });
  });
}
function consultarNomes(q){
  q = (q || '').trim();
  if (q.length < 3) return Promise.resolve([]);
  return buscaCrua(q).then(function(nomes){
    if (nomes.length) return nomes.slice(0, 10);
    return fuzzyLocal(q).then(function(loc){
      if (loc.length) return loc;
      return jogo === 'Magic' ? buscaFuzzyMagic(q) : [];
    });
  });
}

function mascaraDinheiro(inp){
  var d = String(inp.value || '').replace(/\D/g, '').replace(/^0+/, '');
  if (!d) { inp.value = ''; return; }
  if (d.length > 9) d = d.slice(0, 9);
  while (d.length < 3) d = '0' + d;
  inp.value = d.slice(0, -2).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + d.slice(-2);
}

$('foto').addEventListener('change', function(){ lerFoto(this.files && this.files[0]); this.value = ''; });
$('nome').addEventListener('input', function(){ clearTimeout(buscaTimer); var v = this.value; buscaTimer = setTimeout(function(){ buscarNomes(v); }, 350); });
document.addEventListener('input', function(ev){ if (ev.target && ev.target.id === 'precoItem') mascaraDinheiro(ev.target); });
document.addEventListener('keydown', function(ev){
  if (ev.key === 'Enter' && ev.target.id === 'precoItem') adicionar();
  if (ev.key === 'Enter' && ev.target.id === 'nome') { var b = document.querySelector('#sugestoes button'); if (b) escolherNome(b.getAttribute('data-nome')); }
});
document.addEventListener('visibilitychange', function(){ if (document.hidden) { if (stream) { stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; } } else if (!stream) ligarCamera(); });

desenharCarrinho();
try { var gi = JSON.parse(sessionStorage.getItem('balcao-item') || 'null'); if (gi && gi.it) { jogo = gi.j; document.querySelectorAll('#jogoSel button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-j') === jogo); }); escolherNome(gi.it.nome); } } catch (e) {}
ligarCamera();
</script>
</body>
</html>
