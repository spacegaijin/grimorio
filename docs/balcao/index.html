<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Balcão — Grimório</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{--bg:#0c0a09;--bg2:#17120f;--card:#1f1915;--borda:#3a2e26;--txt:#f1e6d6;--txt2:#a89a88;--ac:#ff8a2a;--ac2:#ffc247;--ok:#4cd17a;--azul:#1e5bd8;--verm:#d62828}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:100%}
button{font:inherit;cursor:pointer}
.tela{display:none}.tela.on{display:block}

/* ===== TELA SCANNER (câmera cheia) ===== */
#scan{position:fixed;inset:0;background:#000}
#cam{position:absolute;inset:0}
#video{width:100%;height:100%;object-fit:cover;display:block}
.dica{position:absolute;left:0;right:0;top:46%;text-align:center;color:rgba(255,255,255,.8);font-size:13px;text-shadow:0 0 6px #000;padding:0 30px;pointer-events:none;transition:opacity .4s}
.dica.off{opacity:0}
.semcam{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--txt2)}

.topo{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;display:flex;align-items:center;gap:8px;background:linear-gradient(rgba(0,0,0,.75),transparent);z-index:3}
.jogo-sel{display:flex;border:1px solid rgba(255,255,255,.3);border-radius:20px;overflow:hidden;background:rgba(0,0,0,.4)}
.jogo-sel button{background:transparent;border:0;color:#ddd;padding:7px 12px;font-size:13px}
.jogo-sel button.on{background:var(--ac);color:#000;font-weight:600}
.topo .esp{flex:1}
.btn-lista{background:var(--ac2);color:#000;border:0;border-radius:20px;padding:9px 14px;font-weight:700;display:flex;align-items:center;gap:8px}
.btn-lista .n{background:#000;color:var(--ac2);border-radius:12px;padding:1px 8px;font-size:13px}

.lido{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 60px);z-index:3;font-size:12px;color:#fff;text-shadow:0 0 6px #000;opacity:.9}
.lido b{color:var(--ac2)}

.rodape{position:absolute;left:0;right:0;bottom:0;padding:10px 10px calc(env(safe-area-inset-bottom) + 12px);z-index:3;background:linear-gradient(transparent,rgba(0,0,0,.85) 40%)}
.sug{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;max-height:46vh;overflow:auto}
.sug button{background:rgba(255,255,255,.95);color:#000;border:0;border-radius:14px;padding:14px 16px;font-size:17px;font-weight:600;text-align:left;display:flex;align-items:center;gap:10px}
.sug button.hit{background:var(--ac2)}
.sug button small{font-weight:400;color:#555;margin-left:auto;font-size:12px}
.sug-linha{display:flex;gap:6px}
.sug-linha > button:first-child{flex:1}
.sug .liga-mini{flex:none;background:var(--azul);color:#fff;border:0;border-radius:14px;padding:0 14px;font-size:13px;font-weight:600}
body.pk .sug .liga-mini{background:var(--verm)}
.balao{position:fixed;left:12px;right:12px;bottom:34%;z-index:45;background:#000;border:1px solid var(--ac2);border-radius:16px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.balao span{flex:1;min-width:0}
.balao button{white-space:nowrap}
.balao[hidden]{display:none}
.balao b{color:var(--ac2)}
.balao button{background:var(--azul);color:#fff;border:0;border-radius:10px;padding:9px 12px;font-weight:600}
body.pk .balao button{background:var(--verm)}
.sug button.sec{background:rgba(255,255,255,.18);color:#fff;font-weight:500;font-size:14px;padding:10px 14px}
.ferr{display:flex;gap:6px;flex-wrap:wrap}
.ferr button,.ferr label{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:18px;padding:7px 12px;font-size:13px}
.ferr label input{display:none}
.digitar{display:none;position:absolute;left:0;right:0;bottom:0;z-index:4;background:var(--bg2);padding:12px 12px calc(env(safe-area-inset-bottom) + 12px);border-top:1px solid var(--borda)}
.digitar.on{display:block}
.digitar input{width:100%;background:var(--card);border:1px solid var(--borda);color:var(--txt);border-radius:20px;padding:12px 14px;font-size:17px}
.digitar .fechar{position:absolute;right:12px;top:-40px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:16px;padding:6px 12px}
.status{color:var(--txt2);font-size:12px;min-height:16px;margin-top:6px}

/* ===== TELA LISTA ===== */
#lista{min-height:100%;padding-bottom:40px}
#lista header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:var(--bg2);border-bottom:1px solid var(--borda);position:sticky;top:0;z-index:5}
#lista header h1{font-size:17px;margin:0;flex:1;font-family:Georgia,serif;letter-spacing:3px;text-transform:uppercase}
.voltar{background:transparent;border:1px solid var(--borda);color:var(--txt);border-radius:8px;padding:7px 12px}
.itens{padding:12px}
.it{background:var(--card);border:1px solid var(--borda);border-radius:14px;margin-bottom:10px;overflow:hidden}
.it.ok{border-color:rgba(76,209,122,.6)}
.it .cab{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.it .cab img,.it .cab .semimg{width:44px;aspect-ratio:63/88;object-fit:cover;border-radius:4px;background:#000;display:block;flex:none}
.it .cab .nm{flex:1;min-width:0}
.it .cab .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .cab .nm small{color:var(--txt2);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .cab .vl{color:var(--ac2);font-weight:700;white-space:nowrap}
.it .cab .vl.sem{color:var(--txt2);font-weight:400;font-size:13px}
.it .corpo{display:none;padding:0 12px 12px;border-top:1px solid var(--borda)}
.it.aberto .corpo{display:block}
.it .corpo .ed{color:var(--txt2);font-size:12px;margin:10px 0 8px}
.it a.liga{display:block;background:var(--azul);color:#fff;text-decoration:none;border-radius:8px;padding:11px 12px;font-weight:600;text-align:center;margin-bottom:10px}
.it a.liga.pk{background:var(--verm)}
.it .preco{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.it .preco input{width:120px;background:var(--bg);border:1px solid var(--borda);color:var(--txt);border-radius:8px;padding:10px;font-size:18px}
.it .preco input.qtd{width:60px}
.it .preco button{background:transparent;border:1px solid var(--borda);color:var(--txt);border-radius:8px;padding:10px 12px}
.it .preco button.rm{color:#f88;border-color:#633}
.it .ref{color:var(--txt2);font-size:12px;margin-top:8px}
.edicoes{display:flex;gap:8px;overflow-x:auto;padding:8px 0 4px;-webkit-overflow-scrolling:touch}
.edicoes button{flex:none;width:86px;background:var(--bg);border:1px solid var(--borda);border-radius:8px;padding:4px;color:var(--txt);font-size:10px;line-height:1.2;text-align:center}
.edicoes button img{width:100%;border-radius:4px;display:block;margin-bottom:3px;background:#000;aspect-ratio:63/88;object-fit:cover}
.edicoes button.on{border-color:var(--ac2);background:#2a2012}
.resumo{margin:6px 12px;background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:12px}
.resumo .tot{display:flex;justify-content:space-between;align-items:center;font-size:18px}
.resumo .tot b{color:var(--ac2);font-size:24px}
.resumo .pend{color:var(--txt2);font-size:12px;margin-top:4px}
.resumo .acoes{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.resumo .acoes button{background:transparent;border:1px solid var(--borda);color:var(--txt);border-radius:8px;padding:9px 12px}
.resumo .acoes button.zap{background:#25d366;border-color:#25d366;color:#000;font-weight:700}
.vazio{padding:40px 20px;text-align:center;color:var(--txt2)}

.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
.sheet[hidden]{display:none}
.sheet-cab{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;background:var(--bg2);border-bottom:1px solid var(--borda)}
.sheet-cab b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-cab a{color:var(--ac2);text-decoration:none;font-size:14px}
.sheet-cab button{background:transparent;border:1px solid var(--borda);color:var(--txt);border-radius:8px;padding:6px 10px}
.sheet iframe{flex:1;border:0;background:#fff}
.sheet-aviso{padding:6px 12px;font-size:12px;color:var(--txt2);background:var(--bg2)}
.toast{position:fixed;left:50%;bottom:30%;transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:20px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;border:1px solid var(--ac2)}
.toast.on{opacity:.96}
</style>
</head>
<body>

<!-- ===== SCANNER ===== -->
<section id="scan" class="tela on">
  <div id="cam">
    <video id="video" playsinline muted autoplay></video>
    <div class="dica" id="dica">aponte para a carta — o nome pode estar em qualquer lugar da tela</div>
  </div>
  <div class="topo">
    <div class="jogo-sel" id="jogoSel"><button data-j="Magic" class="on">Magic</button><button data-j="Pokémon">Pokémon</button></div>
    <span class="esp"></span>
    <button class="btn-lista" id="irLista">Lista <span class="n" id="contador">0</span></button>
  </div>
  <div class="lido" id="lido">Ligando a câmera…</div>
  <div class="rodape">
    <div class="sug" id="sug"></div>
    <div class="ferr">
      <button id="btDigitar">⌨ Digitar</button>
      <button id="btLer">Ler agora</button>
      <button id="btAuto">Auto: ligado</button>
      <button id="btTrocar">Trocar câmera</button>
      <label>📷 Foto<input type="file" id="foto" accept="image/*" capture="environment"></label>
    </div>
    <div class="status" id="status"></div>
  </div>
  <div class="digitar" id="digitar">
    <button class="fechar" id="fecharDigitar">fechar ✕</button>
    <input id="nome" placeholder="nome da carta (pode errar letra)" autocomplete="off">
  </div>
</section>

<!-- ===== LISTA ===== -->
<section id="lista" class="tela">
  <header><button class="voltar" id="irScan">⟵ Scanner</button><h1>Lista</h1></header>
  <div class="itens" id="itens"></div>
  <div class="resumo">
    <div class="tot"><span>Total</span><b id="total">R$ 0,00</b></div>
    <div class="pend" id="pend"></div>
    <div class="acoes"><button class="zap" id="whats">Enviar no WhatsApp</button><button id="copiar">Copiar</button><button id="limpar">Limpar tudo</button></div>
  </div>
</section>

<div class="toast" id="toast"></div>
<div class="balao" id="balao" hidden><span>✓ <b id="balaoNome"></b> na lista</span><button id="balaoLiga">Ver na Liga</button></div>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-cab"><b id="sheetTit">Liga</b><a id="sheetFora" href="#" target="_blank" rel="noopener">Abrir fora ↗</a><button id="sheetFechar">Fechar ✕</button></div>
  <iframe id="sheetFrame" src="about:blank" referrerpolicy="no-referrer"></iframe>
  <div class="sheet-aviso">Se a Liga não aparecer aqui dentro, use "Abrir fora".</div>
</div>

<script>
/* ===== estado ===== */
var jogo = 'Magic';
var carrinho = [];           /* {id, nome, jogo, set, num, img, ed, preco, qtd, ref, refTxt} */
var auto = true, lendo = false, worker = null, stream = null, usarFrontal = false, buscaTimer = null;
var modo = 'nome';
var pausaAte = 0, ignorarNome = '', ignorarAte = 0;
var ultimoHit = '', rodapeAtual = {}, cacheNomes = {};
var sugAtuais = [];           /* nomes mostrados nos botões */
var exataAtual = null;        /* carta exata vinda do rodapé {tipo, dados} */

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function dinheiro(v){ return 'R$ ' + (v || 0).toFixed(2).replace('.', ','); }
function lerPreco(s){ s = String(s || '').replace(/[^0-9,\.]/g, ''); if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.'); var v = parseFloat(s); return isNaN(v) ? 0 : v; }
function status(t){ $('status').textContent = t || ''; }
function toast(t){ var e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(function(){ e.classList.remove('on'); }, 1400); }
function ligaUrlJogo(nome, j){
  return j === 'Magic'
    ? 'https://www.ligamagic.com.br/?view=cards/card&card=' + encodeURIComponent(nome)
    : 'https://www.ligapokemon.com.br/?view=cards/card&card=' + encodeURIComponent(nome);
}
function salvar(){ try { localStorage.setItem('balcao-carrinho', JSON.stringify(carrinho)); } catch (e) {} }
try { var salvo = JSON.parse(localStorage.getItem('balcao-carrinho') || '[]'); if (Array.isArray(salvo)) carrinho = salvo; } catch (e) {}
carrinho.forEach(function(it){
  if (!it.id) it.id = Date.now() + '' + Math.random().toString(36).slice(2, 6);
  if (it.preco == null) it.preco = 0; if (!it.qtd) it.qtd = 1; if (!it.jogo) it.jogo = 'Magic';
});

var cambio = {USD: 0, EUR: 0};
function carregarCambio(){
  fetch('https://economia.awesomeapi.com.br/last/USD-BRL,EUR-BRL').then(function(r){ return r.json(); }).then(function(j){
    if (j.USDBRL) cambio.USD = parseFloat(j.USDBRL.bid) || 0;
    if (j.EURBRL) cambio.EUR = parseFloat(j.EURBRL.bid) || 0;
  }).catch(function(){});
}
carregarCambio();
function emReais(valor, moeda){
  var tx = cambio[moeda] || 0;
  return (valor > 0 && tx > 0) ? valor * tx : 0;
}


/* ===== câmera ===== */
function ligarCamera(){
  if (stream) { stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { semCamera('Este navegador não libera a câmera. Use ⌨ Digitar ou 📷 Foto.'); return; }
  navigator.mediaDevices.getUserMedia({video: {facingMode: usarFrontal ? 'user' : {ideal: 'environment'}, width: {ideal: 1280}, height: {ideal: 960}}, audio: false})
    .then(function(s){ stream = s; $('video').srcObject = s; $('lido').textContent = 'Mire a carta.'; if (auto) loopAuto(); })
    .catch(function(e){ semCamera('Câmera bloqueada (' + e.name + '). Permita a câmera no navegador ou use ⌨ Digitar / 📷 Foto.'); });
}
function semCamera(msg){
  var c = $('cam'); if (!c.querySelector('.semcam')) { var d = document.createElement('div'); d.className = 'semcam'; d.textContent = msg; c.appendChild(d); }
  $('lido').textContent = '';
}

/* ===== OCR ===== */
function getWorker(){
  if (worker) return Promise.resolve(worker);
  if (typeof Tesseract === 'undefined') return Promise.reject(new Error('leitor não carregou'));
  status('Carregando leitor de texto (só na primeira vez)…');
  return Tesseract.createWorker('eng').then(function(w){
    worker = w;
    return w.setParameters({tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz'-,. ", tessedit_pageseg_mode: '6'}).then(function(){ status(''); return w; });
  });
}

function quadroInteiro(){
  var v = $('video');
  if (!v.videoWidth) return null;
  var alvoW = 1000, f = Math.min(1, alvoW / v.videoWidth);
  var cv = document.createElement('canvas'); cv.width = Math.round(v.videoWidth * f); cv.height = Math.round(v.videoHeight * f);
  var ctx = cv.getContext('2d'); ctx.drawImage(v, 0, 0, cv.width, cv.height);
  preparar(ctx, cv.width, cv.height);
  return cv;
}
function recorteDe(el, alvoW){
  var v = $('video');
  if (!v.videoWidth) return null;
  /* recorta exatamente a área do elemento (object-fit:cover) */
  var box = $('cam').getBoundingClientRect(), mb = el.getBoundingClientRect();
  var escala = Math.max(box.width / v.videoWidth, box.height / v.videoHeight);
  var vw = v.videoWidth * escala, vh = v.videoHeight * escala;
  var offx = (vw - box.width) / 2, offy = (vh - box.height) / 2;
  var sx = (mb.left - box.left + offx) / escala, sy = (mb.top - box.top + offy) / escala;
  var sw = mb.width / escala, sh = mb.height / escala;
  var cv = document.createElement('canvas');
  var f = alvoW / sw;
  cv.width = alvoW; cv.height = Math.round(sh * f);
  var ctx = cv.getContext('2d');
  ctx.drawImage(v, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
  preparar(ctx, cv.width, cv.height);
  return cv;
}
function preparar(ctx, w, h){
  var d = ctx.getImageData(0, 0, w, h), p = d.data;
  for (var i = 0; i < p.length; i += 4) {
    var g = 0.3 * p[i] + 0.59 * p[i + 1] + 0.11 * p[i + 2];
    g = (g - 128) * 1.5 + 128; g = g < 0 ? 0 : g > 255 ? 255 : g;
    p[i] = p[i + 1] = p[i + 2] = g;
  }
  ctx.putImageData(d, 0, 0);
}
function limparTexto(t){
  t = String(t || '').replace(/\n/g, ' ').replace(/[^A-Za-zÀ-ÿ' \-,]/g, ' ').replace(/\s+/g, ' ').trim();
  var ruido = /^(basic|stage|evolves|from|hp|creature|instant|sorcery|enchantment|artifact|land|legendary|planeswalker|pokemon|ex|gx|the)$/i;
  return t.split(' ').filter(function(w){ return w.length > 1 && !ruido.test(w); }).join(' ').trim();
}
var workerSet = null;
function getWorkerSet(){
  if (workerSet) return Promise.resolve(workerSet);
  if (typeof Tesseract === 'undefined') return Promise.reject(new Error('leitor não carregou'));
  return Tesseract.createWorker('eng').then(function(w){
    workerSet = w;
    return w.setParameters({tessedit_char_whitelist: '0123456789/ABCDEFGHIJKLMNOPQRSTUVWXYZ ', tessedit_pageseg_mode: '6'}).then(function(){ return w; });
  });
}
/* rodapé: Magic "0238 M HOB PT" / "238/300 R DOM EN" ; Pokémon "025/165" */
function interpretarRodape(t){
  t = String(t || '').toUpperCase().replace(/\s+/g, ' ').trim();
  var out = {};
  var mp = t.match(/(\d{1,3})\s*\/\s*(\d{1,3})/);
  if (mp) { out.num = mp[1]; out.total = mp[2]; }
  var mn = t.match(/(?:^|\s)0*(\d{1,4})(?:\s*\/\s*0*\d{1,4})?(?=\s|$)/);
  if (mn && !out.num) out.num = mn[1];
  var toks = t.split(' ').filter(function(x){ return /^[A-Z0-9]{3}$/.test(x) && !/^\d+$/.test(x) && !/^(THE|AND|ART|ILL|TM|INC|LLC)$/.test(x); });
  if (toks.length) out.set = toks[toks.length - 1].toLowerCase();
  return out;
}

function lerQuadro(){
  if (lendo || Date.now() < pausaAte || !$('scan').classList.contains('on')) return Promise.resolve();
  var cv = quadroInteiro();
  if (!cv) return Promise.resolve();
  lendo = true;
  return getWorker().then(function(w){ return w.recognize(cv); }).then(function(r){
    var brutas = r.data.lines || [];
    /* rodapé: qualquer linha com número+código (Magic) ou nnn/nnn (Pokémon) */
    rodapeAtual = {};
    for (var i = 0; i < brutas.length; i++) {
      var rd = interpretarRodape(brutas[i].text || '');
      if ((rd.set && rd.num) || (rd.num && rd.total)) { rodapeAtual = rd; break; }
    }
    var linhas = brutas.map(function(l){ return {t: limparTexto(l.text), c: l.confidence || 0}; })
      .filter(function(l){ return l.t.length >= 3 && l.c >= 40; })
      .sort(function(a, b){ return b.c - a.c; }).slice(0, 4);
    $('dica').classList.toggle('off', brutas.length > 0);
    if (!linhas.length) { $('lido').textContent = ''; return; }
    var rodTxt = (rodapeAtual.set || rodapeAtual.num) ? ' · rodapé: ' + (rodapeAtual.set ? rodapeAtual.set.toUpperCase() + ' ' : '') + (rodapeAtual.num || '') + (rodapeAtual.total ? '/' + rodapeAtual.total : '') : '';
    $('lido').innerHTML = 'Li: <b>' + esc(linhas[0].t) + '</b>' + esc(rodTxt);
    return validarLinhas(linhas.map(function(l){ return l.t; }));
  }).catch(function(e){ status('Leitor: ' + (e && e.message ? e.message : e)); }).then(function(){ lendo = false; });
}
function loopAuto(){
  if (!auto || !stream) return;
  lerQuadro().then(function(){ setTimeout(loopAuto, 250); });
}
function validarLinhas(linhas){
  var i = 0;
  return new Promise(function(res){
    (function prox(){
      if (i >= linhas.length) { res(false); return; }
      var l = linhas[i++];
      var p = cacheNomes[l] ? Promise.resolve(cacheNomes[l]) : consultarNomes(l).then(function(n){ cacheNomes[l] = n; return n; });
      p.then(function(nomes){
        if (nomes.length && nomes[0] === ignorarNome && Date.now() < ignorarAte) { res(true); return; }
        if (nomes.length) {
          if (nomes[0] !== ultimoHit) {
            ultimoHit = nomes[0];
            mostrarSugestoes(nomes.slice(0, 4), similaridade(l, nomes[0]) < 0.85 ? l : '');
            if (rodapeAtual.num) tentarEdicaoExata(nomes[0], rodapeAtual);
          }
          res(true);
        } else prox();
      });
    })();
  });
}

/* ===== busca de nomes ===== */
function similaridade(a, b){
  a = a.toLowerCase(); b = b.toLowerCase();
  if (a === b) return 1;
  var m = a.length, n = b.length; if (!m || !n) return 0;
  var prev = [], cur = [], i, j;
  for (j = 0; j <= n; j++) prev[j] = j;
  for (i = 1; i <= m; i++) { cur[0] = i; for (j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur.slice(); }
  return 1 - prev[n] / Math.max(m, n);
}
function buscaCrua(q){
  var url = jogo === 'Magic'
    ? 'https://api.scryfall.com/cards/autocomplete?q=' + encodeURIComponent(q)
    : 'https://api.tcgdex.net/v2/en/cards?name=like:' + encodeURIComponent(q);
  return fetch(url).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
    if (!j) return [];
    if (jogo === 'Magic') return (j.data || []).slice(0, 20);
    var v = {}, out = []; (Array.isArray(j) ? j : []).forEach(function(c){ if (c.name && !v[c.name]) { v[c.name] = 1; out.push(c.name); } });
    return out.slice(0, 20);
  }).catch(function(){ return []; });
}
function buscaFuzzyMagic(q){
  return fetch('https://api.scryfall.com/cards/named?fuzzy=' + encodeURIComponent(q)).then(function(r){ return r.ok ? r.json() : null; })
    .then(function(c){ return c && c.name ? [c.name] : []; }).catch(function(){ return []; });
}
/* catálogo completo de nomes, baixado uma vez e guardado no celular, para busca aproximada local */
var catalogo = {Magic: null, 'Pokémon': null}, carregandoCat = {};
function normalizar(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim(); }
function getCatalogo(){
  var j = jogo;
  if (catalogo[j]) return Promise.resolve(catalogo[j]);
  try { var s = localStorage.getItem('balcao-cat-' + j); if (s) { catalogo[j] = JSON.parse(s); return Promise.resolve(catalogo[j]); } } catch (e) {}
  if (carregandoCat[j]) return carregandoCat[j];
  status('Baixando lista de nomes (' + j + ') pela primeira vez…');
  var url = j === 'Magic' ? 'https://api.scryfall.com/catalog/card-names' : 'https://api.tcgdex.net/v2/en/cards';
  carregandoCat[j] = fetch(url).then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
    var nomes = [];
    if (j === 'Magic') nomes = (d && d.data) ? d.data : [];
    else { var v = {}; (Array.isArray(d) ? d : []).forEach(function(c){ if (c.name && !v[c.name]) { v[c.name] = 1; nomes.push(c.name); } }); }
    catalogo[j] = nomes.map(function(n){ return [n, normalizar(n)]; });
    try { localStorage.setItem('balcao-cat-' + j, JSON.stringify(catalogo[j])); } catch (e) {}
    status(''); return catalogo[j];
  }).catch(function(){ status(''); return []; });
  return carregandoCat[j];
}
function fuzzyLocal(q){
  var nq = normalizar(q); if (nq.length < 3) return Promise.resolve([]);
  return getCatalogo().then(function(cat){
    var palavras = nq.split(' ').filter(function(w){ return w.length >= 3; });
    var out = [];
    for (var i = 0; i < cat.length; i++) {
      var n = cat[i][1];
      /* corte rápido: tamanho parecido ou alguma palavra em comum */
      if (Math.abs(n.length - nq.length) > 8 && !palavras.some(function(w){ return n.indexOf(w) >= 0; })) continue;
      var s = similaridade(nq, n);
      /* leitura parcial: compara também com o começo do nome do mesmo tamanho */
      var s2 = similaridade(nq, n.slice(0, nq.length)) * 0.95;
      if (s2 > s) s = s2;
      if (s >= 0.55) out.push([s, cat[i][0]]);
    }
    out.sort(function(a, b){ return b[0] - a[0]; });
    return out.slice(0, 10).map(function(x){ return x[1]; });
  });
}
function consultarNomes(q){
  q = (q || '').trim();
  if (q.length < 3) return Promise.resolve([]);
  return buscaCrua(q).then(function(nomes){
    if (nomes.length) return nomes.slice(0, 10);
    return fuzzyLocal(q).then(function(loc){
      if (loc.length) return loc;
      return jogo === 'Magic' ? buscaFuzzyMagic(q) : [];
    });
  });
}


function buscarDigitado(q){
  q = (q || '').trim();
  if (q.length < 3) { mostrarSugestoes([], ''); return; }

}

function irPara(tela){
  $('scan').classList.toggle('on', tela === 'scan'); $('lista').classList.toggle('on', tela === 'lista');
  if (tela === 'lista') { desenharLista(); window.scrollTo(0, 0); if (stream) { stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; } }
  else { if (!stream) ligarCamera(); }
}

/* ===== eventos ===== */
document.addEventListener('click', function(ev){
  var t = ev.target;
  var js = t.closest('#jogoSel button');
  if (js) { jogo = js.getAttribute('data-j'); document.body.classList.toggle('pk', jogo === 'Pokémon'); document.querySelectorAll('#jogoSel button').forEach(function(b){ b.classList.toggle('on', b === js); }); ultimoHit = ''; $('sug').innerHTML = ''; return; }
  var lm = t.closest('.liga-mini');
  if (lm) { var nm = lm.getAttribute('data-liga-nome'); abrirSheet(ligaUrlJogo(nm, jogo), nm); return; }
  if (t.closest('#balaoLiga')) { if (balaoItem) abrirSheet(ligaUrlJogo(balaoItem.nome, balaoItem.jogo), balaoItem.nome); $('balao').hidden = true; return; }
  var sb = t.closest('#sug button');
  if (sb) {
    if (sb.hasAttribute('data-livre')) { adicionarNome(sb.getAttribute('data-livre'), null); return; }
    var i = Number(sb.getAttribute('data-i')); var nome = sugAtuais[i];
    if (nome) adicionarNome(nome, i === 0 ? exataAtual : null);
    return;
  }
  if (t.closest('#irLista')) { irPara('lista'); return; }
  if (t.closest('#irScan')) { irPara('scan'); return; }
  if (t.closest('#btDigitar')) { $('digitar').classList.add('on'); setTimeout(function(){ $('nome').focus(); }, 50); return; }
  if (t.closest('#fecharDigitar')) { $('digitar').classList.remove('on'); $('nome').value = ''; $('sug').innerHTML = ''; return; }
  if (t.closest('#btLer')) { ultimoHit = ''; pausaAte = 0; lerQuadro(); return; }
  if (t.closest('#btAuto')) { auto = !auto; $('btAuto').textContent = 'Auto: ' + (auto ? 'ligado' : 'desligado'); if (auto) loopAuto(); return; }
  if (t.closest('#btTrocar')) { usarFrontal = !usarFrontal; ligarCamera(); return; }
  /* lista */
  var cab = t.closest('.it .cab');
  if (cab) { var id = cab.parentElement.getAttribute('data-id'); aberto = aberto === id ? null : id; desenharLista(); if (aberto) { var inp = document.querySelector('.it.aberto .pr'); if (inp && !inp.value) setTimeout(function(){ inp.focus(); }, 80); } return; }
  var lg = t.closest('a[data-liga]');
  if (lg) { ev.preventDefault(); var it0 = itemPorId(lg.closest('.it').getAttribute('data-id')); abrirSheet(lg.getAttribute('href'), it0 ? it0.nome : 'Liga'); return; }
  if (t.closest('#sheetFechar')) { fecharSheet(); return; }
  var rm = t.closest('.it .rm');
  if (rm) { var idr = rm.closest('.it').getAttribute('data-id'); carrinho = carrinho.filter(function(x){ return x.id !== idr; }); salvar(); atualizarContador(); aberto = null; desenharLista(); return; }
  var cl = t.closest('.it .colar');
  if (cl) { var itc = itemPorId(cl.closest('.it').getAttribute('data-id')); colarPreco(cl.closest('.it').querySelector('.pr'), itc); return; }
  var edb = t.closest('.edicoes button');
  if (edb) {
    var ite = itemPorId(edb.closest('.it').getAttribute('data-id')); var lista = edicoesCache[ite.jogo + '|' + ite.nome] || []; var c = lista[Number(edb.getAttribute('data-i'))];
    if (c) { if (ite.jogo === 'Magic') aplicarMagic(ite, c, false); else aplicarPokemon(ite, c, false); salvar(); desenharLista(); }
    return;
  }
  if (t.closest('#copiar')) { copiar(); return; }
  if (t.closest('#whats')) { whatsapp(); return; }
  if (t.closest('#limpar')) { if (carrinho.length && !confirm('Apagar a lista inteira?')) return; carrinho = []; salvar(); atualizarContador(); desenharLista(); return; }
});
document.addEventListener('input', function(ev){
  var t = ev.target;
  if (t.classList.contains('pr')) { mascaraDinheiro(t); var it = itemPorId(t.closest('.it').getAttribute('data-id')); if (it) { it.preco = lerPreco(t.value); salvar(); atualizarResumo(); } }
  if (t.classList.contains('qtd')) { var it2 = itemPorId(t.closest('.it').getAttribute('data-id')); if (it2) { it2.qtd = parseInt(t.value, 10) || 1; salvar(); atualizarResumo(); } }
  if (t.id === 'nome') { clearTimeout(buscaTimer); var v = t.value; buscaTimer = setTimeout(function(){ buscarDigitado(v); }, 300); }
});
document.addEventListener('keydown', function(ev){
  if (ev.key === 'Enter' && ev.target.id === 'nome') { if (sugAtuais[0]) adicionarNome(sugAtuais[0], null); }
  if (ev.key === 'Enter' && ev.target.classList && ev.target.classList.contains('pr')) { ev.target.blur(); aberto = null; desenharLista(); }
});
$('foto').addEventListener('change', function(){ lerFoto(this.files && this.files[0]); this.value = ''; });
document.addEventListener('visibilitychange', function(){ if (document.hidden) { if (stream) { stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; } } else if (!stream && $('scan').classList.contains('on')) ligarCamera(); });

atualizarContador();
/* completa imagem/edição de itens que ficaram sem (versão antiga ou falha de rede) */
setTimeout(function(){ carrinho.forEach(function(it){ if (!it.img) enriquecer(it); }); }, 800);
ligarCamera();
</script>
</body>
</html>
